<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Absensi Konsultan</title>
    <script>
      // Tema dipasang SEBELUM React jalan. Kalau menunggu komponen ter-mount,
      // halaman sempat tergambar putih terang sepersekian detik sebelum
      // berubah gelap -- kedipan yang menyilaukan di ruangan gelap.
      (function () {
        try {
          var pilihan = localStorage.getItem('cloud_absen_tema') || 'sistem';
          var gelap =
            pilihan === 'gelap' ||
            (pilihan === 'sistem' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (gelap) document.documentElement.classList.add('dark');
        } catch (e) {
          // localStorage diblokir -- biarkan mode terang.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

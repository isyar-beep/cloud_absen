services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud_absen_db
    restart: unless-stopped
    environment:
      # Nilai diambil dari file .env di folder ini (otomatis dibaca docker compose)
      POSTGRES_DB: ${DB_NAME:-cloud_absen}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Zona waktu harus sama dengan API supaya jam absensi konsisten
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      # Terikat ke localhost saja -- database TIDAK boleh diakses dari internet
      # DB_HOST_PORT bisa diganti di .env kalau port 5432 di komputer Anda sudah
      # dipakai PostgreSQL lain (mis. instalasi native di Windows)
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skrip init dijalankan berurutan sesuai abjad saat volume masih kosong.
      # Untuk database yang sudah ada, jalankan file migration secara manual:
      # docker exec -i cloud_absen_db psql -U postgres -d cloud_absen < database/migrations/001_leave_requests.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql
      - ./database/migrations/001_leave_requests.sql:/docker-entrypoint-initdb.d/20-leave-requests.sql
      - ./database/migrations/002_push_token.sql:/docker-entrypoint-initdb.d/30-push-token.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cloud_absen}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: cloud_absen_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      # Terikat ke localhost saja -- akses publik lewat Nginx reverse proxy
      - '127.0.0.1:5000:5000'
    volumes:
      # Foto absensi disimpan di disk lokal -- volume ini membuatnya persisten antar deploy
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:

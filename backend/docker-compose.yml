version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud_absen_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_absen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    container_name: cloud_absen_api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - '5000:5000'

volumes:
  pgdata:
